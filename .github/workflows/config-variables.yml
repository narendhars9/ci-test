name: Configuration variables

on:
 workflow_dispatch:

env:
  cloud: google.com

jobs:
  greeting_job:
    #runs-on: ubuntu-latest
    runs-on: ${{ matrix.os }}
    strategy: 
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      Greetings: Hello

    steps:
      - name: "Say Hello to Everyone"
        shell: bash
        run: echo " Hi $first_Name $Greetings we are using $cloud and configuration variable project id is ${{PROJECT_ID}}"
        env:
          first_name: Narendhar